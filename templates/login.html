{% extends "base.html" %}
{% block title %}Log in — Austin Apex{% endblock %}
{% block content %}
<article class="login-card">
  <div class="login-brand"><span class="brand-mark">AA</span><h1 style="margin:0;">Welcome back</h1><p class="muted">Austin Apex marketing workspace</p></div>
  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
  <form method="post">
    <label>Email
      <input type="email" name="email" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit" class="primary-action" style="width:100%;">Log in</button>
  </form>
</article>
{% endblock %}
